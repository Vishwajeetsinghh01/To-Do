apiVersion: apps/v1
kind: Deployment

metadata:
  name: to-do-app-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: to-do-app

  template:
    metadata:
      labels:
        app: to-do-app

    spec:
      containers:
      - name: to-do-app

        image: to-do-app

        imagePullPolicy: Never

        ports:
        - containerPort: 5000