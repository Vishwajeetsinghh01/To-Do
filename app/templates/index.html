<!DOCTYPE html>
<html>
<head>
    <title>Smart To-Do Manager</title>

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container mt-5">

    <div class="card shadow-lg p-4">

        <h1 class="text-center mb-4">🚀 Smart To-Do Manager</h1>

        <form action="/add" method="POST" class="d-flex mb-4">

            <input type="text"
                   name="task"
                   class="form-control me-2"
                   placeholder="Enter task"
                   required>

            <button class="btn btn-primary">
                Add
            </button>

        </form>

        {% for todo in todos %}

        <div class="task-card d-flex justify-content-between align-items-center p-3 mb-3 rounded">

            <div>

                {% if todo.completed %}
                    <span class="completed">✔ {{ todo.task }}</span>
                {% else %}
                    <span>{{ todo.task }}</span>
                {% endif %}

            </div>

            <div>

                <a href="/complete/{{ todo.id }}"
                   class="btn btn-success btn-sm">
                    Complete
                </a>

                <a href="/delete/{{ todo.id }}"
                   class="btn btn-danger btn-sm">
                    Delete
                </a>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
